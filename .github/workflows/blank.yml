name: Build AETHER APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "Using project files from the repo"
            echo "DIR=." >> "$GITHUB_ENV"
          elif [ -f AETHER-project.zip ]; then
            echo "Unpacking AETHER-project.zip"
            mkdir -p _src
            unzip -o AETHER-project.zip -d _src
            echo "DIR=_src" >> "$GITHUB_ENV"
          else
            echo "ERROR: no app folder and no AETHER-project.zip in the repo. Repo contains:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-debug-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
